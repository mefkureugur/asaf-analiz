<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>ASAF ANALİZ | Eğitim & Finans Yönetimi</title>

    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#020617" />
    <meta name="msapplication-navbutton-color" content="#020617" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ASAF Analiz" />

    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="shortcut icon" href="/favicon.png" type="image/png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

    <script>
      // TEMA — ilk boyamadan ÖNCE çalışmalı.
      // Aksi halde sayfa önce koyu açılır, sonra aydınlığa atlar (göz alır).
      // Bu yüzden burada, <head> içinde ve senkron duruyor.
      (function () {
        try {
          var t = localStorage.getItem('asaf-tema');
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          }
          document.documentElement.setAttribute('data-theme', t);
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute('content', t === 'light' ? '#f1f5f9' : '#020617');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>

    <style>
      /* Yükleme ekranı da temaya uyar; uygulama açılana kadar geçerli */
      :root { --acilis-zemin: #020617; --acilis-metin: #94a3b8; }
      :root[data-theme="light"] { --acilis-zemin: #f1f5f9; --acilis-metin: #475569; }
      body {
        margin: 0;
        background-color: var(--acilis-zemin);
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
      }
      #loader {
        position: fixed;
        inset: 0;
        display: flex; flex-direction: column; justify-content: center; align-items: center;
        background-color: var(--acilis-zemin);
        color: var(--acilis-metin);
        font-weight: 600; font-size: 0.85rem;
        letter-spacing: 0.045em; text-transform: uppercase;
        z-index: 9999;
        gap: 18px;
      }
      #loader img { width: 56px; height: 56px; border-radius: 14px; }
      /* Nabız: dönen çemberden daha sakin, markayı öne çıkarır */
      @keyframes asaf-pulse {
        0%, 100% { opacity: .55; transform: scale(.97); }
        50%      { opacity: 1;   transform: scale(1); }
      }
      #loader img { animation: asaf-pulse 1.6s cubic-bezier(.4,0,.6,1) infinite; }
      /* Hareket azaltma tercihinde nabız durur, marka görünür kalır */
      @media (prefers-reduced-motion: reduce) {
        #loader img { animation: none; opacity: 1; }
      }
    </style>
  </head>

  <body>
    <div id="root">
      <div id="loader">
        <img src="/logo512.png" alt="" />
        ASAF Analiz
      </div>
    </div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
